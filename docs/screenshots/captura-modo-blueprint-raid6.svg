<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="Captura del Simulador RAIDLab en Modo Claro Technical Blueprint con RAID 6 y Gráficos D3.js">
  <defs>
    <pattern id="blueprintGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#cbd5e1" stroke-width="0.8" />
    </pattern>
    <linearGradient id="bpIopsArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Papel técnico de ingeniería claro (Technical / Blueprint) -->
  <rect width="1200" height="650" fill="#f4f7fb" />
  <rect width="1200" height="650" fill="url(#blueprintGrid)" />

  <!-- Top Bar -->
  <rect x="0" y="0" width="1200" height="50" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
  <rect x="28" y="11" width="28" height="28" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5" />
  <circle cx="42" cy="25" r="7" fill="#047857" />
  <text x="66" y="30" fill="#047857" font-family="monospace" font-size="15" font-weight="bold">Un Fantasma en el Sistema · RAIDLab</text>
  <rect x="985" y="12" width="187" height="26" rx="6" fill="#ffffff" stroke="#64748b" />
  <text x="1078" y="29" fill="#0f172a" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Tema: Technical / Blueprint</text>

  <!-- Banner de Estado en Modo Blueprint -->
  <rect x="28" y="68" width="760" height="68" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" />
  <text x="46" y="94" fill="#b45309" font-family="monospace" font-size="13" font-weight="bold">▲ DEGRADADO EN DOBLE PARIDAD RAID 6 (P + Q ACTIVOS)</text>
  <text x="46" y="116" fill="#1e293b" font-family="sans-serif" font-size="11.5">BAY-02 averiado y BAY-04 en Alerta Naranja de Pre-fallo S.M.A.R.T. El controlador resuelve síndromes P (XOR) y Q (GF(2⁸)).</text>

  <!-- Panel 02: Bastidor en Modo Blueprint -->
  <rect x="28" y="150" width="760" height="260" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
  <text x="46" y="178" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold">02. Bastidor de Discos Físicos · Modo Technical / Blueprint (Alto Contraste)</text>
  <text x="770" y="178" fill="#047857" font-family="monospace" font-size="11.5" font-weight="bold" text-anchor="end">RAID 6 · 4 × 8 TB (32 TB Brutos)</text>

  <!-- 4 Bahías claras de alto contraste -->
  <!-- BAY-01 -->
  <rect x="46" y="196" width="172" height="196" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" />
  <text x="58" y="218" fill="#0f172a" font-family="monospace" font-size="11.5" font-weight="bold">BAY-01 · 8 TB</text>
  <text x="58" y="238" fill="#047857" font-family="monospace" font-size="11" font-weight="bold">● OPERATIVO</text>
  <text x="58" y="256" fill="#475569" font-family="monospace" font-size="10">Uso: 14.200 h (35%)</text>
  <rect x="58" y="262" width="148" height="5" rx="2.5" fill="#e2e8f0" />
  <rect x="58" y="262" width="52" height="5" rx="2.5" fill="#059669" />
  <rect x="58" y="278" width="70" height="22" rx="4" fill="#d1fae5" stroke="#059669" />
  <text x="93" y="293" fill="#065f46" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">D0_0</text>
  <rect x="136" y="278" width="70" height="22" rx="4" fill="#fef3c7" stroke="#d97706" />
  <text x="171" y="293" fill="#92400e" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">P1 (XOR)</text>
  <rect x="58" y="306" width="70" height="22" rx="4" fill="#f3e8ff" stroke="#7e22ce" />
  <text x="93" y="321" fill="#6b21a8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Q2 (GF)</text>
  <rect x="136" y="306" width="70" height="22" rx="4" fill="#d1fae5" stroke="#059669" />
  <text x="171" y="321" fill="#065f46" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">D3_0</text>
  <text x="58" y="368" fill="#475569" font-family="monospace" font-size="10">Estado S.M.A.R.T. Óptimo</text>

  <!-- BAY-02: Averiado -->
  <rect x="230" y="196" width="172" height="196" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" />
  <text x="242" y="218" fill="#0f172a" font-family="monospace" font-size="11.5" font-weight="bold">BAY-02 · 8 TB</text>
  <text x="242" y="238" fill="#b91c1c" font-family="monospace" font-size="11" font-weight="bold">✕ AVERIADO (OFFLINE)</text>
  <text x="242" y="256" fill="#b91c1c" font-family="monospace" font-size="10">Fallo Electromecánico</text>
  <rect x="242" y="262" width="148" height="5" rx="2.5" fill="#fecaca" />
  <rect x="242" y="262" width="148" height="5" rx="2.5" fill="#dc2626" />
  <rect x="242" y="278" width="148" height="50" rx="4" fill="#fee2e2" stroke="#dc2626" />
  <text x="316" y="307" fill="#991b1b" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle">Bloques Recalculados vía P+Q</text>
  <text x="242" y="368" fill="#b91c1c" font-family="monospace" font-size="10">Sin pérdida de datos (RAID 6)</text>

  <!-- BAY-03: Operativo -->
  <rect x="414" y="196" width="172" height="196" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" />
  <text x="426" y="218" fill="#0f172a" font-family="monospace" font-size="11.5" font-weight="bold">BAY-03 · 8 TB</text>
  <text x="426" y="238" fill="#047857" font-family="monospace" font-size="11" font-weight="bold">● OPERATIVO</text>
  <text x="426" y="256" fill="#475569" font-family="monospace" font-size="10">Uso: 22.800 h (57%)</text>
  <rect x="426" y="262" width="148" height="5" rx="2.5" fill="#e2e8f0" />
  <rect x="426" y="262" width="84" height="5" rx="2.5" fill="#059669" />
  <rect x="426" y="278" width="70" height="22" rx="4" fill="#fef3c7" stroke="#d97706" />
  <text x="461" y="293" fill="#92400e" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">P0 (XOR)</text>
  <rect x="504" y="278" width="70" height="22" rx="4" fill="#d1fae5" stroke="#059669" />
  <text x="539" y="293" fill="#065f46" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">D1_2</text>
  <rect x="426" y="306" width="70" height="22" rx="4" fill="#d1fae5" stroke="#059669" />
  <text x="461" y="321" fill="#065f46" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">D2_2</text>
  <rect x="504" y="306" width="70" height="22" rx="4" fill="#f3e8ff" stroke="#7e22ce" />
  <text x="539" y="321" fill="#6b21a8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Q3 (GF)</text>
  <text x="426" y="368" fill="#475569" font-family="monospace" font-size="10">Estado S.M.A.R.T. Óptimo</text>

  <!-- BAY-04: Pre-fallo Naranja en Blueprint -->
  <rect x="598" y="196" width="172" height="196" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2" />
  <text x="610" y="218" fill="#0f172a" font-family="monospace" font-size="11.5" font-weight="bold">BAY-04 · 8 TB</text>
  <polygon points="616,228 623,240 609,240" fill="#ea580c" />
  <text x="628" y="239" fill="#c2410c" font-family="monospace" font-size="10.5" font-weight="bold">PRE-FALLO S.M.A.R.T.</text>
  <text x="610" y="256" fill="#c2410c" font-family="monospace" font-size="10" font-weight="bold">Uso: 43.100 h (100%)</text>
  <rect x="610" y="262" width="148" height="5" rx="2.5" fill="#fed7aa" />
  <rect x="610" y="262" width="148" height="5" rx="2.5" fill="#ea580c" />
  <rect x="610" y="278" width="70" height="22" rx="4" fill="#f3e8ff" stroke="#7e22ce" />
  <text x="645" y="293" fill="#6b21a8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Q0 (GF)</text>
  <rect x="688" y="278" width="70" height="22" rx="4" fill="#d1fae5" stroke="#059669" />
  <text x="723" y="293" fill="#065f46" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">D1_3</text>
  <rect x="610" y="310" width="148" height="24" rx="5" fill="#ffedd5" stroke="#ea580c" />
  <text x="684" y="326" fill="#9a3412" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">🔄 Reemplazo Preventivo</text>
  <text x="610" y="368" fill="#c2410c" font-family="monospace" font-size="10">¡Superado umbral 40.000 h!</text>

  <!-- Panel 03: Matriz de Bloques en Modo Blueprint -->
  <rect x="28" y="424" width="760" height="202" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
  <text x="46" y="452" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold">03. Matriz de Bloques y Síndromes P (XOR) + Q (Campos de Galois GF(2⁸))</text>
  <rect x="46" y="468" width="724" height="140" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="64" y="494" fill="#0f172a" font-family="monospace" font-size="12" font-weight="bold">Fila / Stripe      BAY-01 (OK)       BAY-02 (FAIL)      BAY-03 (OK)       BAY-04 (PRE-FALLO)</text>
  <line x1="60" y1="504" x2="750" y2="504" stroke="#cbd5e1" />
  <text x="64" y="526" fill="#047857" font-family="monospace" font-size="11.5">Stripe 0           D0_0              [D0_1 Recalc]      P0 (XOR)          Q0 (GF)</text>
  <text x="64" y="550" fill="#047857" font-family="monospace" font-size="11.5">Stripe 1           D1_0              [P1 (XOR)]         D1_2              Q1 (GF)</text>
  <text x="64" y="582" fill="#b45309" font-family="monospace" font-size="11" font-weight="bold">✓ Síndrome P = D₁ ⊕ D₂   |   Síndrome Q = (g¹·D₁) ⊕ (g²·D₂) → Soporta hasta 2 discos caídos.</text>

  <!-- Columna Derecha: Gráficos D3.js adaptados dinámicamente al tema Blueprint -->
  <rect x="804" y="68" width="368" height="280" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
  <text x="822" y="96" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold">04. Anillo de Capacidad D3.js</text>
  <circle cx="910" cy="195" r="62" fill="none" stroke="#e2e8f0" stroke-width="20" />
  <circle cx="910" cy="195" r="62" fill="none" stroke="#059669" stroke-width="20" stroke-dasharray="194.7 389.5" transform="rotate(-90 910 195)" />
  <circle cx="910" cy="195" r="62" fill="none" stroke="#0284c7" stroke-width="20" stroke-dasharray="194.7 389.5" stroke-dashoffset="-194.7" transform="rotate(-90 910 195)" />
  <text x="910" y="190" fill="#047857" font-family="monospace" font-size="17" font-weight="bold" text-anchor="middle">16.0 TB</text>
  <text x="910" y="208" fill="#475569" font-family="monospace" font-size="10" text-anchor="middle">50% Útil / 50% P+Q</text>

  <rect x="1000" y="130" width="154" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="1012" y="150" fill="#475569" font-family="sans-serif" font-size="10.5">Capacidad Útil (N−2)×S</text>
  <text x="1012" y="174" fill="#047857" font-family="monospace" font-size="15" font-weight="bold">16.0 TB (50%)</text>

  <rect x="1000" y="200" width="154" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="1012" y="220" fill="#475569" font-family="sans-serif" font-size="10.5">Doble Paridad (P + Q)</text>
  <text x="1012" y="244" fill="#0284c7" font-family="monospace" font-size="15" font-weight="bold">16.0 TB (50%)</text>

  <!-- Panel 05: Gráfico Lineal D3.js en Modo Blueprint -->
  <rect x="804" y="364" width="368" height="262" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
  <text x="822" y="392" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold">05. Curva de Rendimiento IOPS (D3.js)</text>
  <rect x="822" y="408" width="332" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <line x1="850" y1="430" x2="1140" y2="430" stroke="#cbd5e1" stroke-dasharray="3,3" />
  <line x1="850" y1="475" x2="1140" y2="475" stroke="#cbd5e1" />
  <line x1="850" y1="520" x2="1140" y2="520" stroke="#cbd5e1" />
  <path d="M 850 432 L 960 432 L 995 468 L 1138 468 L 1138 520 L 850 520 Z" fill="url(#bpIopsArea)" />
  <path d="M 850 432 L 960 432 L 995 468 L 1138 468" fill="none" stroke="#d97706" stroke-width="2.5" />
  <circle cx="1138" cy="468" r="4" fill="#d97706" stroke="#ffffff" stroke-width="1.5" />
  <text x="822" y="566" fill="#1e293b" font-family="sans-serif" font-size="11.5">Todos los trazos, ejes y gradientes de D3.js se actualizan</text>
  <text x="822" y="584" fill="#1e293b" font-family="sans-serif" font-size="11.5">dinámicamente al conmutar entre Hacker y Blueprint.</text>
</svg>
